[unix_http_server]
file=/run/rencoderr/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/rencoderr/supervisord.pid
childlogdir=/run/rencoderr

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/rencoderr/supervisor.sock

[eventlistener:failures]
command=/usr/bin/python3 /opt/rencoderr/supervisor-events.py
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
priority=1
buffer_size=100
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=1

[program:valkey]
command=/usr/bin/valkey-server /opt/rencoderr/valkey.conf
user=rencoderr
priority=10
autorestart=true
startsecs=1
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=/opt/rencoderr/service.sh php artisan horizon
directory=/app
user=rencoderr
priority=30
autostart=false
autorestart=true
startsecs=1
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:octane]
command=/opt/rencoderr/service.sh php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=%(ENV_OCTANE_WORKERS)s --task-workers=0 --max-requests=500
directory=/app
user=rencoderr
priority=40
autostart=false
autorestart=true
startsecs=1
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/opt/rencoderr/service.sh php artisan schedule:work
directory=/app
user=rencoderr
priority=50
autostart=false
autorestart=true
startsecs=1
stopwaitsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bootstrap]
command=/opt/rencoderr/bootstrap.sh
priority=60
startsecs=0
autorestart=false
exitcodes=0
stopwaitsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
