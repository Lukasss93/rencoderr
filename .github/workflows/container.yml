name: Production container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f docker/compose.vaapi.yaml config --quiet
          docker compose -f compose.yaml -f docker/compose.nvidia.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: rencoderr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, pdo_sqlite, pcntl, bcmath
          coverage: none
      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Test container lifecycle
        env:
          CONTAINER_IMAGE: rencoderr:ci
        run: vendor/bin/pest tests/Unit/ContainerRuntimeTest.php tests/Unit/ContainerKeyTest.php
